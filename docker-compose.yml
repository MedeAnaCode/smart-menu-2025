# блок с описанием контейнеров
services:
  # сервис базы данных
  db:
    # используем официальный образ Postgres
    image: postgres:15
    # переменные окружения для инициализации БД
    environment:
      # имя БД
      POSTGRES_DB: postgres
      # пользователь БД
      POSTGRES_USER: Nastya
      # пароль пользователя
      POSTGRES_PASSWORD: run
    volumes:
      # сохраняем данные в постоянный volume
      - db_data:/var/lib/postgresql/data
    ports:
      # пробрасываем порт наружу
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"

  # сервис с API на Node.js
  backend:
    build:
      # собирать образ из корня проекта
      context: .
      # используемый Dockerfile
      dockerfile: Dockerfile.backend
    environment:
      # имя БД
      POSTGRES_DB: postgres
      # пользователь БД
      POSTGRES_USER: Nastya
      # пароль к БД
      POSTGRES_PASSWORD: run
      # хост БД (имя сервиса db)
      POSTGRES_HOST: db
      # порт БД
      POSTGRES_PORT: 5432
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: smartmenu
      KEYCLOAK_CLIENT_ID: smartmenu-web
      MIGRATIONS_DIR: /app/docs/migrations
      UPLOAD_DIR: /app/uploads
    depends_on:
      # запускать после базы
      - db
      - keycloak
    volumes:
      - uploads_data:/app/uploads
    ports:
      # доступ к API с хоста
      - "3001:3001"
    command: sh -lc "npm run seed:ifempty && npm run dev:api"

  # сервис с фронтендом
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "9000:9000"        # dev-сервер, не 3000:80
    volumes:
      - .:/app             # монтируем корень проекта (здесь лежит src/)
      - /app/node_modules  # чтобы не перетирать node_modules
    # (command можно не задавать, если в Dockerfile уже CMD "npm run dev")

# объявление именованных томов
volumes:
  # том для данных postgres
  db_data:
  keycloak_data:
  uploads_data:
